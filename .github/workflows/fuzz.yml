# Longer fuzzing runs than the 20-second smoke run in `nix flake check` (checks.fuzz):
# every target of fuzz/ for 10 minutes, weekly and on demand. Every target runs even if
# an earlier one crashed; crashes are uploaded as an artifact. Reproduce one from the
# repository root with `nix run .#fuzz -- reproduce <target> <file>`.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Six targets for 10 minutes each by default, plus building the toolchain; longer
    # manual runs are cut off here.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      # Nightly toolchain and cargo-fuzz come from the flake (`apps.fuzz`). The input
      # reaches the script through the environment, never as script text.
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          case "$SECONDS_PER_TARGET" in
            "" | *[!0-9]*)
              echo "seconds must be a whole number, not '$SECONDS_PER_TARGET'" >&2
              exit 1
              ;;
          esac
          nix run .#fuzz -- "$SECONDS_PER_TARGET"

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
