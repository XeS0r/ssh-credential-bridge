[package]
name = "credential-bridge-forge"
description = "Git worker of credential-bridge: tokens from GitHub (PAT, App), GitLab and Forgejo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
credential-bridge-proto = { workspace = true, features = ["api-url"] }
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
rsa = { version = "0.9.10", features = ["getrandom"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
