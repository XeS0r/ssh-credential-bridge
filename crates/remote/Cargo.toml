[package]
name = "credential-bridge-remote"
description = "Server-side credential-bridge program: git credential helper, gpg shim, setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "credential_bridge_remote"
path = "src/lib.rs"

[[bin]]
name = "credential-bridge-remote"
path = "src/main.rs"

# Built statically for Linux musl (x86_64, aarch64, s390x): no tokio, no TLS, no D-Bus.
[dependencies]
anyhow.workspace = true
clap.workspace = true
credential-bridge-gpg.workspace = true
credential-bridge-platform.workspace = true
credential-bridge-proto.workspace = true
rustix = { workspace = true, features = ["event"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
